# CI: the same gate as the pre-push hook on every change, and a full build
# of GIMPhoto when the build itself changes (a patch, Flathub's recipe).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - run: pipx install ruff
      # GIMPHOTO_CHECK_PATCHES: also clone GIMP and check every patch applies
      - run: GIMPHOTO_CHECK_PATCHES=1 scripts/check

  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$base" HEAD 2>/dev/null | grep -qE '^(patches/|flatpak/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # About 1-2 hours: only when patches/ or flatpak/ change (or by hand).
    needs: [check, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.diegochagas.GIMPhoto.json
          bundle: GIMPhoto.flatpak
          cache-key: gimphoto-${{ hashFiles('flatpak/**', 'patches/**') }}
          upload-artifact: true
