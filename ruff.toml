# Lint rules for the build tools and tests (scripts/check runs ruff when
# installed; CI always does).
line-length = 120
# Vendored as is from gimp-setup (see their headers): kept identical, not
# reformatted. force-exclude applies this to the files scripts/check names.
extend-exclude = ["plugins/comfyui-service/comfyui_client.py", "plugins/photo-restoration/restore_mask.py"]
force-exclude = true

[lint]
select = ["E", "F", "W", "EXE", "RUF100"]

[lint.per-file-ignores]
# GIMP plug-ins must call gi.require_version() before importing from
# gi.repository, so their imports cannot all be at the top.
"plugins/**/*.py" = ["E402"]
